<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SST Browser Reset</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #1f2933;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(460px, 100%);
        border: 1px solid #d9e2ec;
        border-radius: 12px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #52606d;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        color: #1263c7;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser setup reset complete</h1>
      <p>SST saved servers, login tokens, cached settings, and local browser state for this dashboard origin have been cleared.</p>
      <a id="continue-link" href="/">Continue to setup</a>
    </main>
    <script>
      (function resetSstBrowserState() {
        var prefixes = ["sst-"];
        var explicitKeys = [
          "sst-servers",
          "sst-active-server",
          "sst-api-key",
          "sst-api-url",
          "sst-auth-token",
          "sst-auth-token-session"
        ];

        function clearStorage(storage) {
          if (!storage) return;
          var keys = [];
          for (var i = 0; i < storage.length; i += 1) {
            var key = storage.key(i);
            if (!key) continue;
            if (explicitKeys.indexOf(key) !== -1 || prefixes.some(function(prefix) { return key.indexOf(prefix) === 0; })) {
              keys.push(key);
            }
          }
          keys.forEach(function(key) { storage.removeItem(key); });
        }

        clearStorage(window.localStorage);
        clearStorage(window.sessionStorage);

        document.cookie.split(";").forEach(function(cookie) {
          var name = cookie.split("=")[0].trim();
          if (!name) return;
          document.cookie = name + "=; Max-Age=0; path=/";
        });

        var params = new URLSearchParams(window.location.search);
        var next = params.get("return") || "/";
        var link = document.getElementById("continue-link");
        link.setAttribute("href", next);

        window.setTimeout(function() {
          window.location.href = next;
        }, 1200);
      })();
    </script>
  </body>
</html>
